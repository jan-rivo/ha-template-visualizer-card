name: CI

on:
  push:
    branches: [main, v0.2]
  pull_request:

jobs:
  build:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Fail if dist/ is out of date
        run: git diff --exit-code -- dist/
